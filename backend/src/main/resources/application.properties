spring.application.name=xenonovamart

# Shopify Config
app.shopify.apiKey=${SHOPIFY_API_KEY}
app.shopify.apiSecret=${SHOPIFY_API_SECRET}
app.shopify.webhookSecret=${SHOPIFY_WEBHOOK_SECRET}

app.shopify.redirectUri=${SHOPIFY_REDIRECT_URI}
app.publicBaseUrl=${PUBLIC_BASE_URL}

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

